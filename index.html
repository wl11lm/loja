<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Itens à venda</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="titulo"></h1>
  <p class="aviso">Todos os valores são negociáveis. Escolha os itens e fale comigo pelo WhatsApp.</p>
  <div class="barra">
    <input id="busca" placeholder="Buscar...">
    <select id="cat"><option value="">Todas</option></select>
  </div>
  <div id="grade" class="grade"></div>
</main>
<button id="btn-carrinho" class="dark">Carrinho (0)</button>
<dialog id="det"></dialog>
<dialog id="car"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
let itens = [];
let carrinho = JSON.parse(localStorage.getItem("carrinho") || "[]"); // lista de ids
const rotulo = { disponivel: "", reservado: "Reservado", vendido: "Vendido" };
const preco = p => p == null ? "" : "R$ " + Number(p).toFixed(2).replace(".", ",");

$("titulo").textContent = CONFIG.NOME_LOJA;
document.title = CONFIG.NOME_LOJA;

async function carregar() {
  const { data, error } = await db.from("items").select("*").order("created_at", { ascending: false });
  if (error) { $("grade").textContent = "Erro ao carregar os itens."; return; }
  itens = data;
  // tira do carrinho o que não está mais disponível
  carrinho = carrinho.filter(id => itens.some(i => i.id === id && i.status === "disponivel"));
  const cats = [...new Set(itens.map(i => i.category).filter(Boolean))];
  $("cat").innerHTML = '<option value="">Todas</option>' + cats.map(c => `<option>${esc(c)}</option>`).join("");
  desenhar();
}

function desenhar() {
  const q = $("busca").value.toLowerCase(), c = $("cat").value;
  const lista = itens.filter(i => (!c || i.category === c) && i.name.toLowerCase().includes(q));
  $("grade").innerHTML = lista.map(i => `
    <div class="card ${i.status === "vendido" ? "vendido" : ""}" onclick="detalhe('${i.id}')">
      ${i.photos?.[0] ? `<img src="${esc(i.photos[0])}" loading="lazy">` : '<div class="sem-foto"></div>'}
      <div class="info"><b>${esc(i.name)}</b><br>
        <span class="preco">${preco(i.price)}</span>
        ${rotulo[i.status] ? `<span class="tag">${rotulo[i.status]}</span>` : ""}
      </div>
    </div>`).join("") || "<p>Nenhum item encontrado.</p>";
  $("btn-carrinho").textContent = `Carrinho (${carrinho.length})`;
}

function detalhe(id) {
  const i = itens.find(x => x.id === id);
  const noCarrinho = carrinho.includes(id);
  $("det").innerHTML = `
    <div class="fotos">${(i.photos || []).map(f => `<img src="${esc(f)}">`).join("")}</div>
    <h2>${esc(i.name)}</h2>
    <p class="preco">${preco(i.price)} · valor negociável</p>
    <p>${esc(i.description).replace(/\n/g, "<br>")}</p>
    <button onclick="$('det').close()">Fechar</button>
    ${i.status === "disponivel"
      ? `<button class="dark" onclick="alternar('${id}')">${noCarrinho ? "Remover do carrinho" : "Adicionar ao carrinho"}</button>`
      : `<span class="tag">${rotulo[i.status]}</span>`}`;
  $("det").showModal();
}

function alternar(id) {
  carrinho = carrinho.includes(id) ? carrinho.filter(x => x !== id) : [...carrinho, id];
  localStorage.setItem("carrinho", JSON.stringify(carrinho));
  $("det").close();
  desenhar();
  if ($("car").open) abrirCarrinho();
}

function abrirCarrinho() {
  const lista = itens.filter(i => carrinho.includes(i.id));
  const texto = "Olá! Tenho interesse nestes itens:\n" + lista.map(i => "- " + i.name).join("\n") + "\nPodemos conversar sobre os valores?";
  $("car").innerHTML = `
    <h2>Carrinho</h2>
    <p class="aviso">Os valores são negociáveis e combinados pelo WhatsApp.</p>
    ${lista.map(i => `<div class="linha">${esc(i.name)} <button onclick="alternar('${i.id}')">Remover</button></div>`).join("") || "<p>Seu carrinho está vazio.</p>"}
    <p><button onclick="$('car').close()">Fechar</button>
    ${lista.length ? `<a class="btn dark" href="https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(texto)}">Enviar pelo WhatsApp</a>` : ""}</p>`;
  if (!$("car").open) $("car").showModal();
}

$("btn-carrinho").onclick = abrirCarrinho;
$("busca").oninput = desenhar;
$("cat").onchange = desenhar;
carregar();
</script>
</body>
</html>
